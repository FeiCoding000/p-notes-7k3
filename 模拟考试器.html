<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-103 模拟考试器</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1d2129;--muted:#6b7280;--line:#e5e7eb;
  --brand:#2563eb;--brand-soft:#e8efff;--ok:#16a34a;--ok-soft:#e7f7ec;--bad:#dc2626;--bad-soft:#fdecec;--warn:#d97706;--warn-soft:#fff4e0;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111318;--card:#1a1d24;--text:#e6e8ec;--muted:#9aa3b2;--line:#2b303a;
  --brand:#6b9bff;--brand-soft:#1d2a47;--ok:#4ade80;--ok-soft:#163323;--bad:#f87171;--bad-soft:#3a1a1a;--warn:#fbbf24;--warn-soft:#3a2c10;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:8px}
.mode p{margin:0;flex:1}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px}
.stat b{display:block;font-size:22px}
label.inline{display:flex;align-items:center;gap:6px;margin:4px 0}
select,input[type=number]{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
/* 考试界面 */
.topbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.progress{flex:1;min-width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand)}
.tags span{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--brand-soft);color:var(--brand);margin-right:6px}
.tags span.warn{background:var(--warn-soft);color:var(--warn)}
.stem{white-space:pre-wrap;margin:12px 0}
details.case{background:var(--bg);border-radius:8px;padding:8px 12px;margin:10px 0}
details.case summary{cursor:pointer;font-weight:600}
details.case div{white-space:pre-wrap;font-size:14px;max-height:50vh;overflow:auto}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:10px 12px}
.opt .k{font-weight:700;min-width:20px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:8px;padding:10px 14px;margin-top:12px}
.feedback.ok{background:var(--ok-soft)}.feedback.bad{background:var(--bad-soft)}.feedback.info{background:var(--warn-soft)}
.shots img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:8px 0;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions .sp{flex:1}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.nav button{padding:6px 0;font-size:13px;position:relative}
.nav button.done{background:var(--brand-soft)}
.nav button.cur{outline:2px solid var(--brand)}
.nav button.right{background:var(--ok-soft);border-color:var(--ok)}
.nav button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.nav button.flag::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.comments{white-space:pre-wrap;font-size:13px;color:var(--muted);max-height:240px;overflow:auto}
.score{font-size:44px;font-weight:700}
.pass{color:var(--ok)}.fail{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.hidden{display:none}
.hs-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hs-item:last-child{border-bottom:0}
.hs-item select{max-width:100%;width:100%}
.hs-item.sel-row{grid-template-columns:minmax(120px,max-content) minmax(0,1fr)}
.yn{display:flex;gap:6px}
.yn button{padding:4px 16px}
.yn button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.hs-item.right .yn button.on, .hs-item.right select{border-color:var(--ok);outline:2px solid var(--ok)}
.hs-item.wrong .yn button.on, .hs-item.wrong select{border-color:var(--bad);outline:2px solid var(--bad)}
.hs-fix{grid-column:1/-1;font-size:13px;color:var(--ok)}
.area{border:1px dashed var(--line);border-radius:10px;padding:8px 14px;margin:10px 0}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:grab;font-size:14px}
.chip.pick{border-color:var(--brand);background:var(--brand-soft)}
.slot{min-height:38px;border:1px dashed var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.slot.over{border-color:var(--brand);background:var(--brand-soft)}
.slot.empty{color:var(--muted)}
@media (max-width:640px){.hs-item,.hs-item.sel-row{grid-template-columns:1fr}}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font:13px/1.5 Consolas,monospace;margin:10px 0}
/* ---- 手机适配 ---- */
html{-webkit-text-size-adjust:100%}
button,.chip,.slot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img{max-width:100%;height:auto}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:12px 12px 90px}
  .card{padding:14px;border-radius:10px;margin-bottom:12px}
  h1{font-size:20px}
  .topbar .in{padding:8px 12px;gap:8px}
  .topbar .in b,.topbar .hide-m{display:none}
  .progress{order:10;flex-basis:100%;min-width:0}
  select,input[type=number]{font-size:16px} /* iOS 小于 16px 会自动放大页面 */
  .hs-item select{padding:8px}
  .opt{padding:12px}
  .yn button{padding:8px 20px}
  .stats{gap:16px}
  .stat b{font-size:18px}
  .nav{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
  .actions button{flex:1 1 auto}
  .actions .sp{display:none}
  table{font-size:13px}
  td,th{padding:5px 4px}
  .kbd-tip{display:none}
  pre.code{font-size:12px}
}
kbd{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div id="app"></div>
<script src="exam/questions.js"></script>
<script src="exam/interactive.js"></script>
<script>
"use strict";
const QS = window.QUESTIONS || [];
const byId = Object.fromEntries(QS.map(q => [q.id, q]));
const PASS = 0.7; // 微软考试 700/1000
const INTER = window.INTERACTIVE || {};
const isInter = q => !!INTER[q.id];                                            // 有交互数据的 HOTSPOT / 拖拽题
const isImg = q => (q.kind === "hotspot" || q.kind === "dragdrop") && !isInter(q); // 只能看截图自评的题
const blanks = q => { const d = INTER[q.id]; return d.type === "drag" ? d.slots : d.items; };
const filled = (q, a) => isInter(q) ? Array.isArray(a) && blanks(q).every((_, i) => a[i] != null) : !!a;

/* ---------- 本地存储 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("ai103." + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ai103." + k, JSON.stringify(v)); } catch {} },
};
// wrong: {id: 错误次数}；marked: [id]；history: [{date, mode, total, correct}]
function recordResult(id, ok) {
  const w = store.get("wrong", {});
  if (ok) { if (w[id]) { w[id]--; if (w[id] <= 0) delete w[id]; } }
  else w[id] = (w[id] || 0) + 1;
  store.set("wrong", w);
}
function toggleMarked(id) {
  const m = new Set(store.get("marked", []));
  m.has(id) ? m.delete(id) : m.add(id);
  store.set("marked", [...m]);
}

/* ---------- 工具 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtTime = s => `${String(s / 3600 | 0).padStart(2, "0")}:${String(s % 3600 / 60 | 0).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const $ = sel => document.querySelector(sel);

/* ---------- 会话状态 ---------- */
let S = null; // {mode, ids, idx, ans:{id:"AC"|"self-ok"|"self-bad"}, checked:{id:true}, flags:Set, endAt, submitted}
let tick = null;

function startSession(mode, ids, opts = {}) {
  if (!ids.length) { alert("没有符合条件的题目"); return; }
  S = { mode, ids, idx: opts.idx || 0, ans: {}, checked: {}, flags: new Set(), revealed: {}, submitted: false,
        endAt: mode === "exam" ? Date.now() + opts.minutes * 60000 : null, title: opts.title };
  clearInterval(tick);
  if (S.endAt) tick = setInterval(updateTimer, 1000);
  renderQuestion();
}

/* ---------- 首页 ---------- */
function renderHome() {
  clearInterval(tick); S = null;
  const wrong = store.get("wrong", {}), marked = store.get("marked", []), hist = store.get("history", []);
  const pos = store.get("practicePos", 0);
  const counts = { choice: 0, inter: 0, img: 0 };
  QS.forEach(q => isImg(q) ? counts.img++ : isInter(q) ? counts.inter++ : counts.choice++);
  $("#app").innerHTML = `
  <div class="wrap">
    <div class="card">
      <h1>AI-103 模拟考试器</h1>
      <div class="muted">题库共 ${QS.length} 题：选择题 ${counts.choice} · 可交互 HOTSPOT / 拖拽 ${counts.inter}（自动判分）· 待整理的图片题 ${counts.img}（看截图自评）</div>
      <div class="stats">
        <div class="stat"><b>${Object.keys(wrong).length}</b><span class="muted small">错题本</span></div>
        <div class="stat"><b>${marked.length}</b><span class="muted small">已标记</span></div>
        <div class="stat"><b>${hist.length}</b><span class="muted small">考试次数</span></div>
        <div class="stat"><b>${hist.length ? Math.round(hist[hist.length - 1].pct * 100) + "%" : "—"}</b><span class="muted small">上次成绩</span></div>
      </div>
    </div>
    <div class="grid">
      <div class="card mode">
        <h2>📝 模拟考试</h2>
        <p class="muted small">随机抽题、限时，交卷后才出分。</p>
        <label class="inline">题数 <select id="exN"><option>40</option><option selected>50</option><option>60</option><option value="0">全部</option></select></label>
        <label class="inline">时长 <input id="exT" type="number" value="100" min="10" style="width:70px"> 分钟</label>
        <label class="inline"><input id="exImg" type="checkbox" checked> 包含 HOTSPOT / 拖拽题</label>
        <button class="primary" id="goExam">开始考试</button>
      </div>
      <div class="card mode">
        <h2>📖 顺序练习</h2>
        <p class="muted small">按题号逐题做，提交后立刻看答案和评论。自动记住进度。</p>
        <label class="inline"><input id="prImg" type="checkbox" checked> 包含 HOTSPOT / 拖拽题</label>
        <button class="primary" id="goPractice">${pos ? `继续（第 ${pos + 1} 题起）` : "开始练习"}</button>
        ${pos ? `<button id="resetPractice">从头开始</button>` : ""}
      </div>
      <div class="card mode">
        <h2>🎲 随机练习</h2>
        <p class="muted small">打乱顺序练习，即时反馈。</p>
        <button class="primary" id="goRandom">开始</button>
      </div>
      <div class="card mode">
        <h2>❌ 错题 / 🚩 标记</h2>
        <p class="muted small">做对一次错误次数减一，减到 0 自动移出错题本。</p>
        <button class="primary" id="goWrong" ${Object.keys(wrong).length ? "" : "disabled"}>练错题（${Object.keys(wrong).length}）</button>
        <button id="goMarked" ${marked.length ? "" : "disabled"}>练标记题（${marked.length}）</button>
      </div>
    </div>
    ${hist.length ? `<div class="card"><h2>考试记录</h2><table><tr><th>时间</th><th>题数</th><th>得分</th><th>结果</th></tr>
      ${hist.slice(-10).reverse().map(h => `<tr><td>${esc(h.date)}</td><td>${h.total}</td><td>${Math.round(h.pct * 100)}%</td><td class="${h.pct >= PASS ? "pass" : "fail"}">${h.pct >= PASS ? "通过" : "未通过"}</td></tr>`).join("")}
      </table><div class="actions"><button id="clearHist">清空记录</button><button id="clearWrong">清空错题本</button></div></div>` : ""}
    <p class="muted small"><span class="kbd-tip">快捷键：<kbd>A</kbd>–<kbd>F</kbd> 选择 · <kbd>Enter</kbd> 提交/下一题 · <kbd>←</kbd><kbd>→</kbd> 切题 · <kbd>M</kbd> 标记。</span>
      答案来源：官方答案；缺失的用社区最高票（题目上会标注），HOTSPOT 以截图为准。</p>
  </div>`;
  const ids = img => QS.filter(q => img || !isImg(q)).map(q => q.id);
  $("#goExam").onclick = () => {
    const n = +$("#exN").value, pool = shuffle(ids($("#exImg").checked));
    startSession("exam", n ? pool.slice(0, n) : pool, { minutes: +$("#exT").value || 100 });
  };
  $("#goPractice").onclick = () => startSession("practice", ids($("#prImg").checked), { idx: Math.min(pos, QS.length - 1), title: "顺序练习" });
  $("#resetPractice") && ($("#resetPractice").onclick = () => { store.set("practicePos", 0); renderHome(); });
  $("#goRandom").onclick = () => startSession("random", shuffle(ids(true)), { title: "随机练习" });
  $("#goWrong").onclick = () => startSession("random", shuffle(Object.keys(wrong).map(Number).filter(i => byId[i])), { title: "错题练习" });
  $("#goMarked").onclick = () => startSession("random", marked.filter(i => byId[i]), { title: "标记题练习" });
  $("#clearHist") && ($("#clearHist").onclick = () => { if (confirm("清空考试记录？")) { store.set("history", []); renderHome(); } });
  $("#clearWrong") && ($("#clearWrong").onclick = () => { if (confirm("清空错题本？")) { store.set("wrong", {}); renderHome(); } });
}

/* ---------- 判分 ---------- */
function credit(q, a) {
  if (isInter(q)) { if (!Array.isArray(a)) return 0; const b = blanks(q); return b.filter((x, i) => a[i] === x.answer).length / b.length; }
  return isCorrect(q, a) ? 1 : 0;
}
function isCorrect(q, a) {
  if (!a) return false;
  if (isInter(q)) return credit(q, a) === 1;
  if (isImg(q)) return a === "self-ok";
  return [...a].sort().join("") === [...q.answer].sort().join("");
}

/* ---------- 题目界面 ---------- */
function renderQuestion() {
  const q = byId[S.ids[S.idx]], a = S.ans[q.id] || "";
  const exam = S.mode === "exam", showFb = S.checked[q.id] || S.submitted;
  const multi = q.answer.length > 1;
  const answeredCount = S.ids.filter(id => S.ans[id]).length;
  const marked = new Set(store.get("marked", []));

  const tagHtml = [
    ...q.tags.map(t => `<span>${esc(t)}</span>`),
    multi ? `<span>多选 · 选 ${q.answer.length} 项</span>` : "",
    q.answerSource === "voted" && showFb ? `<span class="warn">答案取自社区最高票</span>` : "",
  ].join("");

  let body = "";
  if (q.case) body += `<details class="case"><summary>案例背景（点开查看）</summary><div>${esc(q.case)}</div></details>`;
  body += `<div class="stem">${esc(q.stem)}</div>`;

  if (isInter(q)) {
    body += renderInter(q, a, showFb);
    if (showFb) {
      const b = blanks(q), n = b.filter((x, i) => (a || [])[i] === x.answer).length;
      body += `<div class="feedback ${n === b.length ? "ok" : "bad"}">${n === b.length ? "✅ 全部正确" : `❌ 答对 ${n} / ${b.length} 个空`}（每个空 1 分）</div>`;
      if (INTER[q.id].doubt) body += `<div class="feedback info small">⚠️ 答案存疑：${esc(INTER[q.id].doubt)}</div>`;
      body += `<details style="margin-top:8px"><summary class="small muted">原题截图</summary><div class="shots">${q.images.map(src => `<img src="${esc(src)}" loading="lazy">`).join("")}</div></details>`;
    }
  } else if (!isImg(q)) {
    body += q.options.map(o => {
      let cls = a.includes(o.key) ? "sel" : "";
      if (showFb) cls = q.answer.includes(o.key) ? "right" : (a.includes(o.key) ? "wrong" : "");
      return `<button class="opt ${cls}" data-k="${o.key}" ${showFb ? "disabled" : ""}><span class="k">${o.key}.</span><span>${esc(o.text)}</span></button>`;
    }).join("");
    if (showFb) {
      const ok = isCorrect(q, a);
      body += `<div class="feedback ${ok ? "ok" : "bad"}">${ok ? "✅ 回答正确" : `❌ 回答错误，你的答案：${a || "未作答"}`} · 正确答案：<b>${q.answer || "?"}</b>${q.vote ? ` · 社区投票：${esc(q.vote)}` : ""}</div>`;
      if (q.images.length) body += `<details style="margin-top:8px"><summary class="small muted">原题截图</summary><div class="shots">${q.images.map(src => `<img src="${esc(src)}" loading="lazy">`).join("")}</div></details>`;
    }
  } else {
    const rev = S.revealed[q.id] || showFb;
    body += `<div class="feedback info small">这类题的作答区和标准答案都在截图里（截图下半部分是 Correct Answer）。先根据题干自己想好答案，再展开截图核对，然后给自己判分。</div>`;
    body += rev
      ? `<div class="shots">${q.images.map(src => `<img src="${esc(src)}" loading="lazy">`).join("")}</div>
         <div class="actions"><button id="selfOk" class="${a === "self-ok" ? "primary" : ""}" ${S.submitted ? "disabled" : ""}>✅ 我答对了</button>
         <button id="selfBad" class="${a === "self-bad" ? "primary" : ""}" ${S.submitted ? "disabled" : ""}>❌ 我答错了</button></div>`
      : `<div class="actions"><button class="primary" id="reveal">展开截图核对答案</button></div>`;
  }

  if (showFb && q.comments) body += `<details style="margin-top:8px"><summary class="small muted">社区评论</summary><div class="comments">${esc(q.comments)}</div></details>`;

  let navCls = id => {
    const c = [];
    if (id === q.id) c.push("cur");
    if (S.submitted || (!exam && S.checked[id])) c.push(isCorrect(byId[id], S.ans[id]) ? "right" : (S.ans[id] ? "wrong" : ""));
    else if (S.ans[id]) c.push("done");
    if (S.flags.has(id)) c.push("flag");
    return c.join(" ");
  };

  const canCheck = !exam && !isImg(q) && !showFb;
  $("#app").innerHTML = `
  <div class="topbar"><div class="in">
    <button id="home">← 首页</button>
    <b>${exam ? (S.submitted ? "考试回顾" : "模拟考试") : esc(S.title)}</b>
    <span class="muted small">${S.idx + 1} / ${S.ids.length}</span>
    <div class="progress"><i style="width:${answeredCount / S.ids.length * 100}%"></i></div>
    ${exam && !S.submitted ? `<span class="timer" id="timer"></span><button class="primary" id="submitExam">交卷</button>` : ""}
    ${exam && S.submitted ? `<button id="toResult">成绩单</button>` : ""}
  </div></div>
  <div class="wrap">
    <div class="card">
      <div class="tags"><span>Q${q.id}</span>${tagHtml}</div>
      ${body}
      <div class="actions">
        <button id="prev" ${S.idx ? "" : "disabled"}>← 上一题</button>
        <button id="flag">${S.flags.has(q.id) ? "🚩 取消复查" : "🏳 标记复查"}</button>
        <button id="star">${marked.has(q.id) ? "★ 已收藏" : "☆ 收藏"}</button>
        <span class="sp"></span>
        ${canCheck ? `<button class="primary" id="check" ${filled(q, a) ? "" : "disabled"}>提交本题</button>` : ""}
        <button id="next" class="${canCheck ? "" : "primary"}" ${S.idx < S.ids.length - 1 ? "" : "disabled"}>下一题 →</button>
      </div>
    </div>
    <div class="card"><div class="nav">${S.ids.map((id, i) => `<button data-i="${i}" class="${navCls(id)}">${i + 1}</button>`).join("")}</div>
      <div class="muted small" style="margin-top:8px">${exam && !S.submitted ? "蓝色＝已作答 · 橙点＝标记复查" : "绿＝对 · 红＝错 · 橙点＝标记复查"}</div></div>
  </div>`;

  updateTimer();
  $("#home").onclick = () => { if (exam && !S.submitted && !confirm("考试未交卷，确定离开？")) return; renderHome(); };
  $("#prev").onclick = () => go(S.idx - 1);
  $("#next").onclick = () => go(S.idx + 1);
  $("#flag").onclick = () => { S.flags.has(q.id) ? S.flags.delete(q.id) : S.flags.add(q.id); renderQuestion(); };
  $("#star").onclick = () => { toggleMarked(q.id); renderQuestion(); };
  document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(+b.dataset.i));
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(b.dataset.k));
  $("#check") && ($("#check").onclick = check);
  $("#reveal") && ($("#reveal").onclick = () => { S.revealed[q.id] = true; renderQuestion(); });
  if (isInter(q)) bindInter(q, showFb);
  $("#selfOk") && ($("#selfOk").onclick = () => selfGrade(true));
  $("#selfBad") && ($("#selfBad").onclick = () => selfGrade(false));
  $("#submitExam") && ($("#submitExam").onclick = () => submitExam(false));
  $("#toResult") && ($("#toResult").onclick = renderResult);
}

/* ---------- HOTSPOT / 拖拽 交互 ---------- */
let picked = null; // 拖拽题：点选中的选项下标
function renderInter(q, a, fb) {
  const d = INTER[q.id]; a = a || [];
  let h = d.prompt ? `<div class="feedback info small">${esc(d.prompt)}</div>` : "";
  if (d.code) h += `<pre class="code">${esc(d.code)}</pre>`;
  if (d.exhibit) h += `<details class="case" open><summary>题目截图（不含答案）</summary><div class="shots">${d.exhibit.map(src => `<img src="${esc(src)}" loading="lazy">`).join("")}</div></details>`;
  const mark = (i, ans) => fb ? (a[i] === ans ? "right" : "wrong") : "";
  if (d.type === "select") {
    h += `<div class="area"><div class="small muted">Answer Area</div>` + d.items.map((it, i) => {
      const yn = it.options.length === 2 && it.options[0] === "Yes" && it.options[1] === "No";
      const ctl = yn
        ? `<div class="yn">${it.options.map((o, k) => `<button data-b="${i}" data-v="${k}" class="${a[i] === k ? "on" : ""}" ${fb ? "disabled" : ""}>${o}</button>`).join("")}</div>`
        : `<select data-b="${i}" ${fb ? "disabled" : ""}><option value="">— 请选择 —</option>${it.options.map((o, k) => `<option value="${k}" ${a[i] === k ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      return `<div class="hs-item ${yn ? "" : "sel-row"} ${mark(i, it.answer)}"><div>${esc(it.label)}</div>${ctl}
        ${fb && a[i] !== it.answer ? `<div class="hs-fix">正确：${esc(it.options[it.answer])}</div>` : ""}</div>`;
    }).join("") + `</div>`;
  } else {
    h += `<div class="small muted">${fb ? "" : "先点选项、再点空格（电脑上也可以直接拖）；点已填的空格可清空。选项可重复使用。"}</div>
      <div class="pool">${d.pool.map((p, k) => `<div class="chip ${picked === k ? "pick" : ""}" draggable="${!fb}" data-p="${k}">${esc(p)}</div>`).join("")}</div>
      <div class="area"><div class="small muted">Answer Area</div>` + d.slots.map((sl, i) => `
      <div class="hs-item sel-row ${mark(i, sl.answer)}"><div>${esc(sl.label || (d.ordered ? `第 ${i + 1} 步` : ""))}</div>
        <div class="slot ${a[i] == null ? "empty" : ""}" data-s="${i}">${a[i] == null ? "拖到这里" : esc(d.pool[a[i]])}</div>
        ${fb && a[i] !== sl.answer ? `<div class="hs-fix">正确：${esc(d.pool[sl.answer])}</div>` : ""}</div>`).join("") + `</div>`;
  }
  return h;
}
function setBlank(q, i, v) {
  if (S.submitted || S.checked[q.id]) return;
  const a = Array.isArray(S.ans[q.id]) ? S.ans[q.id].slice() : blanks(q).map(() => null);
  a[i] = v;
  S.ans[q.id] = a.some(x => x != null) ? a : undefined;
  renderQuestion();
}
function bindInter(q, fb) {
  if (fb) return;
  document.querySelectorAll(".yn button").forEach(b => b.onclick = () => setBlank(q, +b.dataset.b, +b.dataset.v));
  document.querySelectorAll("select[data-b]").forEach(s => s.onchange = () => setBlank(q, +s.dataset.b, s.value === "" ? null : +s.value));
  document.querySelectorAll(".chip").forEach(c => {
    c.onclick = () => { picked = picked === +c.dataset.p ? null : +c.dataset.p; renderQuestion(); };
    c.ondragstart = e => e.dataTransfer.setData("text/plain", c.dataset.p);
  });
  document.querySelectorAll(".slot").forEach(sl => {
    const i = +sl.dataset.s;
    sl.onclick = () => { if (picked != null) { const p = picked; picked = null; setBlank(q, i, p); } else if (!sl.classList.contains("empty")) setBlank(q, i, null); };
    sl.ondragover = e => { e.preventDefault(); sl.classList.add("over"); };
    sl.ondragleave = () => sl.classList.remove("over");
    sl.ondrop = e => { e.preventDefault(); picked = null; setBlank(q, i, +e.dataTransfer.getData("text/plain")); };
  });
}

function go(i) {
  picked = null;
  if (i < 0 || i >= S.ids.length) return;
  S.idx = i;
  if (S.title === "顺序练习") store.set("practicePos", QS.findIndex(q => q.id === S.ids[i]));
  renderQuestion(); window.scrollTo(0, 0);
}
function choose(k) {
  const q = byId[S.ids[S.idx]];
  if (S.submitted || S.checked[q.id] || !q.options.some(o => o.key === k)) return;
  let a = S.ans[q.id] || "";
  if (q.answer.length > 1) a = a.includes(k) ? a.replace(k, "") : [...a + k].sort().join("");
  else a = k;
  S.ans[q.id] = a; renderQuestion();
}
function check() {
  const q = byId[S.ids[S.idx]];
  if (!filled(q, S.ans[q.id]) || S.checked[q.id]) return;
  S.checked[q.id] = true; recordResult(q.id, isCorrect(q, S.ans[q.id])); renderQuestion();
}
function selfGrade(ok) {
  const q = byId[S.ids[S.idx]];
  if (S.submitted) return;
  S.ans[q.id] = ok ? "self-ok" : "self-bad";
  if (S.mode !== "exam") { S.checked[q.id] = true; recordResult(q.id, ok); }
  renderQuestion();
}

/* ---------- 计时 & 交卷 ---------- */
function updateTimer() {
  const el = $("#timer"); if (!el || !S || !S.endAt) return;
  const left = Math.max(0, Math.round((S.endAt - Date.now()) / 1000));
  el.textContent = "⏱ " + fmtTime(left);
  el.classList.toggle("low", left < 300);
  if (left === 0 && !S.submitted) submitExam(true);
}
function submitExam(timeout) {
  const un = S.ids.filter(id => !S.ans[id]).length;
  if (!timeout && !confirm(un ? `还有 ${un} 题未作答（HOTSPOT 题需要自评才算作答），确定交卷？` : "确定交卷？")) return;
  S.submitted = true; clearInterval(tick);
  const correct = S.ids.filter(id => isCorrect(byId[id], S.ans[id])).length;
  const pctScore = S.ids.reduce((s, id) => s + credit(byId[id], S.ans[id]), 0) / S.ids.length;
  S.ids.forEach(id => recordResult(id, isCorrect(byId[id], S.ans[id])));
  const hist = store.get("history", []);
  hist.push({ date: new Date().toLocaleString("zh-CN"), total: S.ids.length, correct, pct: pctScore });
  store.set("history", hist);
  if (timeout) alert("时间到，已自动交卷");
  renderResult();
}
function renderResult() {
  const rows = S.ids.map((id, i) => ({ i, q: byId[id], a: S.ans[id], ok: isCorrect(byId[id], S.ans[id]) }));
  const correct = rows.filter(r => r.ok).length, pct = rows.reduce((s, r) => s + credit(r.q, r.a), 0) / rows.length;
  const part = f => { const rs = rows.filter(r => f(r.q)); return rs.length ? `${rs.filter(r => r.ok).length} / ${rs.length}` : "—"; };
  const show = (q, a) => isInter(q) ? (Array.isArray(a) ? `对 ${blanks(q).filter((x, i) => a[i] === x.answer).length}/${blanks(q).length} 空` : "未作答") : a === "self-ok" ? "自评对" : a === "self-bad" ? "自评错" : (a || "未作答");
  $("#app").innerHTML = `<div class="wrap">
    <div class="card"><h1>成绩单</h1>
      <div class="score ${pct >= PASS ? "pass" : "fail"}">${Math.round(pct * 1000)} <span class="small muted">/ 1000</span></div>
      <div>${pct >= PASS ? "✅ 通过（≥700）" : "❌ 未通过（需 ≥700）"} · 完全答对 ${correct} / ${rows.length} 题（多空题按空给部分分）</div>
      <div class="stats"><div class="stat"><b>${part(q => !isImg(q))}</b><span class="muted small">选择题</span></div>
        <div class="stat"><b>${part(isInter)}</b><span class="muted small">HOTSPOT / 拖拽（交互）</span></div>
        <div class="stat"><b>${part(isImg)}</b><span class="muted small">HOTSPOT / 拖拽（自评）</span></div>
        <div class="stat"><b>${part(q => q.case)}</b><span class="muted small">案例题</span></div></div>
      <div class="actions"><button class="primary" id="review">逐题回顾</button><button id="reviewWrong">只看错题</button><button id="home">回首页</button></div>
    </div>
    <div class="card"><h2>答题明细</h2><table><tr><th>#</th><th>题号</th><th>类型</th><th>你的答案</th><th>正确答案</th><th></th></tr>
      ${rows.map(r => `<tr><td>${r.i + 1}</td><td>Q${r.q.id}</td><td>${r.q.kind === "choice" || r.q.kind === "multi" ? "选择" : esc(r.q.tags[0] || "图片题")}</td><td>${show(r.q, r.a)}</td>
        <td>${r.q.options.length ? r.q.answer : "见回顾"}</td><td><a href="#" data-i="${r.i}" class="${r.ok ? "pass" : "fail"}">${r.ok ? "✔" : "✘"} 查看</a></td></tr>`).join("")}
    </table></div></div>`;
  $("#review").onclick = () => go(0);
  $("#home").onclick = renderHome;
  $("#reviewWrong").onclick = () => {
    const ids = rows.filter(r => !r.ok).map(r => r.q.id);
    if (!ids.length) return alert("全对，没有错题 🎉");
    startSession("random", ids, { title: "本次考试错题" });
  };
  document.querySelectorAll("a[data-i]").forEach(el => el.onclick = e => { e.preventDefault(); go(+el.dataset.i); });
  window.scrollTo(0, 0);
}

/* ---------- 键盘 ---------- */
document.addEventListener("keydown", e => {
  if (!S || e.target.matches("input,select,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if (/^[A-H]$/.test(k) && k !== "M") choose(k);
  else if (k === "M") $("#flag")?.click();
  else if (e.key === "ArrowLeft") go(S.idx - 1);
  else if (e.key === "ArrowRight") go(S.idx + 1);
  else if (e.key === "Enter") { e.preventDefault(); const c = $("#check"); c && !c.disabled ? check() : go(S.idx + 1); }
});

if (!QS.length) document.getElementById("app").innerHTML = '<div class="wrap"><div class="card">没找到题库数据，请先运行 <code>python exam/build_questions.py</code></div></div>';
else renderHome();
</script>
</body>
</html>
